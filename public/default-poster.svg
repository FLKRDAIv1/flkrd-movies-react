<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#141419" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow)" />

  <!-- Subtle grid/film lines -->
  <line x1="0" y1="20" x2="500" y2="20" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="10 10" />
  <line x1="0" y1="730" x2="500" y2="730" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="10 10" />

  <!-- Center Card / Icon Container -->
  <g transform="translate(250, 320)">
    <!-- Glow Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="54" fill="#18181f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    
    <!-- Film Reel / Play Icon -->
    <path d="M-12 -20 L22 0 L-12 20 Z" fill="url(#primaryGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="250" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">
    FLKRD
  </text>
  <text x="250" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#dc2626" letter-spacing="6">
    STUDIO
  </text>

  <!-- Bottom Kurdish Label -->
  <text x="250" y="690" text-anchor="middle" font-family="'Rabar_021', 'Speda', sans-serif" font-weight="500" font-size="13" fill="#ffffff" fill-opacity="0.4">
    پۆستەری بەردەست نییە
  </text>
</svg>
